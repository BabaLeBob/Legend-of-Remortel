 const snap=mkSnap(1);NET.conns.forEach(c=>{if(c.conn.open)c.conn.send({t:'start',spec:sp,snap})});NET.evF=[];NET.evB=[];NET.evP=[]}
function backToLobby(){NET.phase='lobby';NET.conns.forEach(c=>{if(c.conn.open)c.conn.send({t:'end'})});S.over=0;bcLobby();showLobbyUI()}
function overClick(){if(NET.mode=='client')return;if(NET.mode=='host')backToLobby();else showSel()}
function frame(dt){if(NET.mode=='client')clientStep(dt);else{if(S.h&&S.h.hu&&!menu)S.h.aim=M();step(dt);if(NET.host&&NET.phase=='game'&&!menu)netTick(dt)}}
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;frame(dt);draw();requestAnimationFrame(loop)}
buildSel();buildCats();$('shq').oninput=renderShop;$('bMenu').onclick=showMain;showMain();requestAnimationFrame(loop);
</script>
</body>
